<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>Novo produto · Fornada · Sobra Zero</title>
</head>
<body>
  <h1>Novo produto</h1>
  {% if erro %}<p><strong>{{ erro }}</strong></p>{% endif %}
  <form method="post">
    <p><label>Nome <input name="nome" value="{{ dados.nome }}" maxlength="120" required></label></p>
    <p><label>Categoria <input name="categoria" value="{{ dados.categoria }}" maxlength="60" required></label></p>
    <p><label>Preço de venda (€) <input name="preco_venda" value="{{ dados.preco_venda }}" inputmode="decimal" required></label></p>
    <p><label>Validade (horas) <input name="validade_horas" type="number" min="1" value="{{ dados.validade_horas }}" required></label></p>
    <p><label>Conservação
      <select name="conservacao">
        {% for opcao in conservacoes %}
        <option value="{{ opcao }}" {% if dados.conservacao == opcao %}selected{% endif %}>{{ opcao }}</option>
        {% endfor %}
      </select>
    </label></p>
    <p><label>Rendimento do lote <input name="rendimento_lote" type="number" min="1" value="{{ dados.rendimento_lote }}" required></label></p>
    <p><button type="submit">Guardar</button> <a href="{{ url_for('produtos.lista') }}">Cancelar</a></p>
  </form>
</body>
</html>
