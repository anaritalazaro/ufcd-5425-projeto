<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>Nova matéria-prima · Fornada · Sobra Zero</title>
</head>
<body>
  <h1>Nova matéria-prima</h1>
  {% if erro %}<p><strong>{{ erro }}</strong></p>{% endif %}
  <form method="post">
    <p><label>Nome <input name="nome" value="{{ dados.nome }}" maxlength="120" required></label></p>
    <p><label>Unidade
      <select name="unidade">
        {% for opcao in unidades %}
        <option value="{{ opcao }}" {% if dados.unidade == opcao %}selected{% endif %}>{{ opcao }}</option>
        {% endfor %}
      </select>
    </label></p>
    <p><label>Custo unitário (€ por unidade) <input name="custo_unitario" value="{{ dados.custo_unitario }}" inputmode="decimal" required></label></p>
    <p><label>Stock mínimo <input name="stock_minimo" value="{{ dados.stock_minimo }}" inputmode="decimal"></label></p>
    <p><label>Alergénios <input name="alergenios" value="{{ dados.alergenios }}"></label></p>
    <p>O stock começa a 0; o stock inicial regista-se como uma entrada.</p>
    <p><button type="submit">Guardar</button> <a href="{{ url_for('materias_primas.lista') }}">Cancelar</a></p>
  </form>
</body>
</html>
