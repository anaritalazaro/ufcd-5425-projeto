services:
  db:
    image: postgres:18
    container_name: fornada-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
       # Só no próprio computador (localhost), sem acesso a partir da rede
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  dados_postgres: